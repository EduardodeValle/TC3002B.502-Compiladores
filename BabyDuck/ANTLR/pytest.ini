[pytest]
# Configuracion de pytest para BabyDuck

# Mostrar output completo
addopts = -v -s --tb=short

# Orden de ejecucion de tests
testpaths = .

# Patron de archivos de prueba
python_files = test_*.py

# Patron de clases de prueba
python_classes = Test*

# Patron de funciones de prueba
python_functions = test_*

# Desactivar warnings
filterwarnings =
    ignore::DeprecationWarning

# Markers personalizados
markers =
    valid: Tests de casos validos
    invalid: Tests de casos invalidos
