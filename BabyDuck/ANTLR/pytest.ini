[pytest]
# Configuración de pytest para BabyDuck

# Mostrar output completo
addopts = -v -s --tb=short

# Orden de ejecución de tests
testpaths = .

# Patrón de archivos de prueba
python_files = test_*.py

# Patrón de clases de prueba
python_classes = Test*

# Patrón de funciones de prueba
python_functions = test_*

# Desactivar warnings
filterwarnings =
    ignore::DeprecationWarning

# Markers personalizados
markers =
    valid: Tests de casos válidos
    invalid: Tests de casos inválidos
